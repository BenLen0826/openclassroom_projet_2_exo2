
<div class="content">
  <app-page-header [title]="titlePage()" [stats]="stats()"></app-page-header>

  @if (error()) {
    <div class="center">
      <p>{{ error() }}</p>
    </div>
  }

  <app-chart
    [config]="{
      type: 'line',
      labels: years(),
      data: medalsPerYear(),
      backgroundColor: '#0b868f'
    }">
  </app-chart>

  <div class="center">
    <app-back-button
      label="Go back"
      ariaLabel="Go back to the home page">
    </app-back-button>
  </div>
</div>
