
<div class="content">
  @if (country$ | async; as country) {
    <app-page-header [title]="country.titlePage" [stats]="country.stats"></app-page-header>

    <app-chart
      [config]="{
        type: 'line',
        labels: country.years,
        data: country.medalsPerYear,
        backgroundColor: '#0b868f'
      }">
    </app-chart>
  }

  <div class="center">
    <app-back-button
      label="Go back"
      ariaLabel="Go back to the home page">
    </app-back-button>
  </div>
</div>
