
<div class="content">
  <app-page-header [title]="titlePage()" [stats]="stats()"></app-page-header>

  @if (error()) {
    <div class="center">
      <p>{{ error() }}</p>
    </div>
  }

  <div class="chart-container wrapper-container">
    <div class="container">
      <app-chart
        [config]="{
          type: 'line',
          labels: years(),
          data: medalsPerYear(),
          backgroundColor: '#0b868f'
        }">
      </app-chart>
    </div>
  </div>

  <div class="center">
    <a routerLink="">Go back</a>
  </div>
</div>
