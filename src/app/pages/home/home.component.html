
<div class="content">
  <app-page-header title="Medals per Country" [stats]="stats()"></app-page-header>

  @if (error()) {
    <div class="center">
      <p>{{ error() }}</p>
    </div>
  }

  <app-chart
    [config]="{
      type: 'pie',
      labels: countryNames(),
      data: medalsPerCountry(),
      backgroundColor: ['#0b868f', '#adc3de', '#7a3c53', '#8f6263', 'orange', '#94819d'],
      hoverOffset: 4
    }"
    (sliceClick)="onCountryClick($event)">
  </app-chart>
</div>
