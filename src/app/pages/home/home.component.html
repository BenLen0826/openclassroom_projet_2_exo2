
<div class="content">
  @if (countries$ | async; as countries) {
    <app-page-header title="Medals per Country" [stats]="countries.stats"></app-page-header>

    <app-chart
      [config]="{
        type: 'pie',
        labels: countries.countryNames,
        data: countries.medalsPerCountry,
        backgroundColor: ['#0b868f', '#adc3de', '#7a3c53', '#8f6263', 'orange', '#94819d'],
        hoverOffset: 4
      }"
      (sliceClick)="onCountryClick($event)">
    </app-chart>
  }
</div>
